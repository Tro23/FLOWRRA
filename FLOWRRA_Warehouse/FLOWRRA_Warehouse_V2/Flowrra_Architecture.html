html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,440px)}
.wheel{display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,32px);min-width:0}
.wheel svg{width:100%;max-width:min(92vh,960px);height:auto;display:block}
.panel{background:var(--panel);border-left:1px solid var(--line);padding:32px 30px 40px;overflow-y:auto;max-height:100vh;position:sticky;top:0}
h1{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:30px;line-height:1.15;margin:0 0 12px;padding-left:12px;border-left:5px solid var(--muted)}
.intro{color:var(--muted);margin:0 0 22px;max-width:62ch}
.rings{list-style:none;margin:0;padding:0}
.rings li{padding:12px 14px;margin:0 0 6px;border-left:3px solid transparent;border-radius:0 6px 6px 0}
.rings li.on{background:color-mix(in srgb,var(--pc,#888) 12%,transparent);border-left-color:var(--pc,#888)}
.rings h2{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:15px;letter-spacing:.02em;margin:0 0 4px;color:var(--muted)}
.rings li.on h2{color:var(--ink)}
.rb p{margin:0 0 6px;max-width:62ch}
.k{font-weight:600;margin-right:6px}
code{font-family:"JetBrains Mono",Consolas,monospace;font-size:.84em;background:var(--code-bg);color:var(--code-ink);padding:1px 5px;border-radius:4px;word-break:break-word}
.hub{fill:var(--hub);stroke:var(--line);stroke-width:2}
.track{stroke:var(--track);stroke-width:1}
.chev{stroke:var(--chev);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fb,.fbhead{stroke:#9C89B8;stroke-width:2;stroke-linecap:round}.fb{stroke-dasharray:5 5}
.hub-title{fill:var(--ink);font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;font-size:34px;font-weight:700;letter-spacing:3px}
.hub-sub{fill:var(--muted);font-family:Barlow,sans-serif;font-size:14px}
.fb-label{fill:#9C89B8;font-family:Barlow,sans-serif;font-size:13px}
.al{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;pointer-events:none}
.arc{stroke:var(--bg);stroke-width:2.5;cursor:pointer;outline:none}
.arc:hover{filter:brightness(1.08)}
.arc.sel{stroke:var(--ink);stroke-width:3}
.arc:focus-visible{stroke:var(--ink);stroke-width:4;stroke-dasharray:6 4}

<aside class="panel" aria-live="polite">
<h1 id="ptitle">FLOWRRA Ouroboros</h1>
<p class="intro" id="pintro">One step of the orchestrator, read clockwise from Repair. Each ring zooms further out: what happens, what flows through, how it is built, what carries over to the next cycle, and who would own it. Hover, tap or tab to a segment.</p>
<ol class="rings" id="rings"></ol>
</aside>
<script>
const D={"phases": [{"n": "0. Repair", "col": "#E63946", "step": "Fixes the conflicts the previous step's moves created, before any fleet looks.", "din": "<code>proximity<\/code>, <code>_step_deadlocked<\/code>, <code>_step_warning<\/code>", "dout": "repaired <code>current_pos<\/code>, <code>yield_durations<\/code>, a rebuilt proximity index and every fleet's <code>sf_peer_proximity<\/code>", "mech": "Wave Function Collapse in three tiers: spatial escape, temporal rewind, right-of-way yield. It escalates when the same pair keeps meeting, by repeat collision or by recurrence within 2 cells; convoys are exempt. The recovery head invokes it as one holon-level decision, or it is forced on deadlock. If it moves anyone, the snapshot is re-taken for every fleet.", "carry": "Yield holds (<code>_yield_until<\/code>), each pair's collision and recurrence count, and position history for temporal rewinds.", "team": "Operations research &amp; recovery: the collapse protocol, escalation rules and recovery policy."}, {"n": "1. Look", "col": "#F4A261", "step": "Every fleet gets its own view of the same moment: its neighbourhood and its goal, plus one warehouse-wide number, the holon's integrity.", "din": "repaired <code>current_pos<\/code>, graph <code>G<\/code>, the density field, <code>aisle_index<\/code>", "dout": "<code>node_features<\/code> of 777 per fleet; adjacency with 4 edge channels (closeness, conflict, head-on, arrival order)", "mech": "84 base features: goal gradient, rays, situation flags, and the holon's integrity (0, 0.5 or 1), recomputed fresh before every look. 693 density features: a 231-cell diamond in three channels, mask, repulsion and slow memory.", "carry": "The density field remembers. Its fast memory fades within about 2 steps; the slow channel has a half-life of about 53 steps, long enough to learn that a corridor keeps jamming.", "team": "Physics &amp; perception: the density field, rays and the state layout."}, {"n": "2. Decide", "col": "#E9C46A", "step": "One shared policy picks an action for every fleet, all from that same moment.", "din": "<code>node_features<\/code>, adjacency, <code>valid_action_masks<\/code>", "dout": "<code>actions<\/code> 0 to 6 per fleet, <code>action_ranking<\/code>, and one recovery mode for the holon (<code>last_recovery_q<\/code>)", "mech": "A gated 3D convolution reads the density diamond; graph attention lets neighbours inform each other. Three value heads, safety, delivery and efficiency, are combined 6 : 4 : 1 to choose, so safety outranks delivery and delivery outranks efficiency. A separate recovery head makes the holon's recovery decision. Action masks veto impossible moves; epsilon-greedy explores.", "carry": "Epsilon follows a gaussian over the run: near-greedy at the start, most exploratory mid-run, near-greedy again at the end.", "team": "Multi-agent policy: the network, action masks and exploration."}, {"n": "3. Move", "col": "#2A9D8F", "step": "All fleets move at once. Consequences are then settled against one frozen snapshot, so no fleet gains by being processed first.", "din": "<code>actions<\/code>, <code>valid_action_masks<\/code>, tabu actions, proximity for braking", "dout": "new positions, <code>waiting_nodes<\/code>, goal claims, stopped fleets", "mech": "Phase A: every fleet moves. Snapshot. Phase B: waits, goal claims and arrivals are judged against it. Proximity braking, tabu, and a BFS fallback for livelock. VDA 5050-style hardware halts, with rescue handovers for dead fleets.", "carry": "Goal claims, waiting timers, and dead fleets with their open pickups until a rescuer arrives.", "team": "Fleet operations: movement, braking, fault halts and rescue handovers."}, {"n": "4. Judge", "col": "#457B9D", "step": "Each fleet is charged for what its own move caused. The holon's own decision, recovery, is judged by the holon.", "din": "<code>old_dist<\/code> against <code>new_dist<\/code>, claimed goals, post-action conflicts", "dout": "rewards of 4 columns per fleet: safety, delivery, efficiency, and the holon's integrity for the recovery head", "mech": "Each head is divided by a fixed value scale, calibrated on cold_run18: safety 34.3, delivery 70.4, efficiency 17.5. Collisions are charged to the move that caused them; integrity and recovery costs go only to the fleets involved. The recovery head gets the holon's integrity and every recovery event at full size. No baseline. The 6 : 4 : 1 priority is applied when choosing, in Decide.", "carry": "Nothing: every step is judged fresh.", "team": "Reward design: the priority heads, attribution and calibration."}, {"n": "5. Remember & learn", "col": "#9C89B8", "step": "The whole step goes into the replay buffer, then one learning step, drawn from the past as well as the present.", "din": "states, adjacency, actions, rewards, next states, next valid masks, the active mask, done", "dout": "updated <code>policy_net<\/code> weights; <code>target_net<\/code> copied every 1,000 learning steps", "mech": "Double DQN: the online network chooses the next action and the target network scores it, which reduces plain DQN's upward bias. Impossible next actions are masked. Huber loss per head, over active fleets only; gradients clipped at 1.0.", "carry": "The replay buffer, 30,000 transitions or about 38 episodes, and the target network, a hard copy every 1,000 learning steps, about every 1.3 episodes.", "team": "MLOps: the replay buffer, Double DQN, target sync and training stability."}], "rings": [{"k": "step", "name": "The step", "meaning": "What happens in this phase."}, {"k": "data", "name": "Data flow", "meaning": "What goes in, and what comes out."}, {"k": "mech", "name": "Mechanism", "meaning": "How it is built."}, {"k": "carry", "name": "Carries over", "meaning": "What persists into the next cycle."}, {"k": "team", "name": "Team", "meaning": "Who would own it."}]};
const ringsEl=document.getElementById('rings');
D.rings.forEach(r=>{const li=document.createElement('li');li.dataset.ring=r.k;li.innerHTML='<h2>'+r.name+'</h2><div class="rb"><p>'+r.meaning+'</p></div>';ringsEl.appendChild(li);});
function body(p,k){
  if(k==='data') return '<p><span class="k">In</span>'+p.din+'</p><p><span class="k">Out</span>'+p.dout+'</p>';
  return '<p>'+({step:p.step,mech:p.mech,carry:p.carry,team:p.team})[k]+'</p>';
}
let cur=null;
function select(i,ring){
  const p=D.phases[i];
  const t=document.getElementById('ptitle');t.textContent=p.n;t.style.borderLeftColor=p.col;
  document.getElementById('pintro').textContent=p.step;
  document.querySelectorAll('#rings li').forEach(li=>{
    li.style.setProperty('--pc',p.col);li.querySelector('.rb').innerHTML=body(p,li.dataset.ring);
    li.classList.toggle('on',li.dataset.ring===ring);});
  if(cur!==i){document.querySelectorAll('.arc').forEach(a=>a.classList.toggle('sel',+a.dataset.phase===i));cur=i;}
}
document.querySelectorAll('.arc').forEach(a=>{
  const go=()=>select(+a.dataset.phase,a.dataset.ring);
  a.addEventListener('mouseenter',go);a.addEventListener('focus',go);a.addEventListener('click',go);
  a.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
});
</script>
